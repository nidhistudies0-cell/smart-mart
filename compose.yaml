services:
  api:
    build: .
    command: npm run dev:api
    env_file:
      - .env
    environment:
      PORT: "5001"
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true

  web:
    build: .
    command: npm run dev:web
    environment:
      API_URL: http://api:5001
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    depends_on:
      - api

volumes:
  node_modules:
